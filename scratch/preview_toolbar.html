<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Preview Toolbar Phần Mềm</title>
  <link rel="stylesheet" href="file:///q:/kimchimobile/css/style.css">
  <style>
    body {
      background: #06090e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 30px;
      margin: 0;
    }
    .preview-card {
      background: #0b111a;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 1400px;
      margin: 0 auto;
    }
    .title-banner {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="preview-card">
    <div class="title-banner">
      <span>🖼️ BẢN XEM TRƯỚC: MỤC NGÀY NẰM CHÍNH GIỮA 2 Ô (Ô KHÁCH HÀNG & Ô TÌM KIẾM)</span>
    </div>

    <!-- TOOLBAR PHẦN MỀM CĂN CHÍNH GIỮA 2 Ô -->
    <div class="sw-toolbar"
      style="display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; width: 100%; flex-wrap: nowrap;">
      
      <!-- CỤM 1 (BÊN TRÁI): TIÊU ĐỀ + CHỌN KHÁCH HÀNG -->
      <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
        <button type="button" class="sw-pill-btn sw-btn-pink active"
          style="padding: 7px 16px; border-radius: 8px; font-weight: 900; letter-spacing: 0.5px; white-space: nowrap; background: #ec4899; color: #fff; border: none;">DANH SÁCH PHẦN MỀM</button>
        <div style="display: flex; align-items: center; gap: 4px;">
          <select class="sw-select-box" style="background: #000; border: 1.5px solid #334155; color: #fff; border-radius: 8px; padding: 6px 12px; font-weight: 700; height: 38px;">
            <option>Tất cả khách hàng</option>
          </select>
          <button type="button" class="sw-clear-btn" style="background: transparent; border: 1px solid #334155; color: #94a3b8; border-radius: 6px; width: 28px; height: 28px; cursor: pointer;">✕</button>
        </div>
      </div>

      <!-- CỤM 2 (CHÍNH GIỮA 2 Ô): BỘ LỌC NGÀY NẰM CÂN ĐỐI TUYỆT ĐỐI GIỮA Ô KHÁCH VÀ Ô TÌM KIẾM -->
      <div style="display: flex; align-items: center; justify-content: center; flex: 1; min-width: 0;">
        <div class="unified-date-filter-box" style="display: inline-flex; align-items: center; background: #000; border: 1.5px solid #334155; border-radius: 9px; padding: 2px 4px; height: 38px; box-sizing: border-box;">
          <select class="unified-mode-select" style="background: transparent; border: none; color: #fff; font-weight: 900; font-size: 0.92rem; padding: 0 8px; outline: none;">
            <option>Ngày</option>
          </select>

          <div class="unified-date-ctrls" style="display: inline-flex; align-items: center; gap: 4px;">
            <button type="button" class="unified-arrow-btn" style="background: #059669; border: none; color: #fff; border-radius: 6px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke: #fff; stroke-width: 2.5; fill: none;"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="unified-date-text" style="color: #fff; font-weight: 900; font-size: 0.95rem; padding: 0 10px; min-width: 90px; text-align: center;">10/11/2026</span>
            <button type="button" class="unified-arrow-btn" style="background: #059669; border: none; color: #fff; border-radius: 6px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke: #fff; stroke-width: 2.5; fill: none;"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <button type="button" class="unified-arrow-btn" style="background: #059669; border: none; color: #fff; border-radius: 6px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke: #fff; stroke-width: 2.5; fill: none;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- CỤM 3 (BÊN PHẢI): Ô TÌM KIẾM + BIDV + NÚT ẨN + NÚT TẠO ĐƠN MỚI -->
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0;">
        <!-- Ô TÌM KIẾM PHẦN MỀM -->
        <div class="search-box-bm" style="height: 38px; box-sizing: border-box; background: #000; border: 1.5px solid #334155; border-radius: 9px; padding: 0 10px; display: inline-flex; align-items: center; gap: 8px;">
          <span class="search-label-single-line" style="color: #f59e0b; font-weight: 900; font-size: 0.82rem; white-space: nowrap;">TÌM KIẾM</span>
          <span style="color: #94a3b8; font-size: 0.85rem;">🔍</span>
          <input type="text" placeholder="Tìm khách / tên máy..." style="background: transparent; border: none; outline: none; color: #fff; font-size: 0.85rem; width: 170px;">
          <button type="button" style="background: transparent; border: none; color: #ef4444; font-weight: 900; cursor: pointer;">✕</button>
        </div>

        <button type="button" style="width: 34px; height: 34px; padding: 0; background: transparent; border: 1.5px solid #059669; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden;">
          <img src="file:///q:/kimchimobile/img/logo_bidv.jpg" style="width: 100%; height: 100%; object-fit: cover;">
        </button>

        <button type="button" style="width: 34px; height: 34px; background: #000; border: 1.5px solid #334155; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #94a3b8;">
          <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

        <button type="button" style="background: linear-gradient(180deg, #ec4899 0%, #db2777 100%); border: 1px solid #f472b6; color: #fff; padding: 7px 16px; border-radius: 8px; font-weight: 900; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; height: 38px; box-sizing: border-box;">
          <span style="font-size: 1.1rem; line-height: 1;">+</span> TẠO ĐƠN MỚI
        </button>
      </div>

    </div>
  </div>
</body>
</html>
