            let val = parseInt(qtyInput.value) || 0;
            val += amount;
            if (val < 0) val = 0;
            qtyInput.value = val;
            updateModalStats();
        }

        function updateModalStats() {
            const price = parseMoney(document.getElementById('device-price').value);
            const cost = parseMoney(document.getElementById('device-cost').value);
            const profit = price - cost;
            document.getElementById('modal-profit-preview').innerText = formatMoney(profit);
        }

        function saveDevice(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('device-index').value);
            const brand = document.getElementById('device-brand').value.trim().toUpperCase();
            const name = document.getElementById('device-name').value.trim().toUpperCase();
            let part = document.getElementById('device-part').value.trim().toUpperCase();
            if (part === 'BO SẠC') part = 'CÁP SẠC';
            const type = document.getElementById('device-type').value.trim().toUpperCase();
            const price = document.getElementById('device-price').value.trim();
            const cost = document.getElementById('device-cost').value.trim();
            const qty = parseInt(document.getElementById('device-qty').value) || 0;
            const color = document.getElementById('device-color').value.trim().toUpperCase();

            if (!brands.includes(brand)) brands.push(brand);
            if (!categories.includes(part)) categories.push(part);
            if (type) {
                if (!types.includes(type)) types.push(type);
                if (!brandTypes[brand]) brandTypes[brand] = getTypesForBrand(brand);
                if (!brandTypes[brand].includes(type)) brandTypes[brand].push(type);
            }
            if (name && !names.includes(name)) names.push(name);

            const deviceObj = { brand, name, part, type, price, cost, qty, color };

            if (index === -1) {
                devices.unshift(deviceObj);
            } else {
                devices[index] = deviceObj;
            }

            saveAllToCloud();
            closeModal();
            currentBrand = brand;
            currentCategory = part;
            currentType = type;
            initTabs();
            renderTable();
        }

        function editDevice(index) {
            const d = devices[index];
            document.getElementById('device-index').value = index;
            const brandVal = d.brand || 'IPHONE';
            populateModalSelects(brandVal);
            document.getElementById('device-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = 'SỬA LINH KIỆN';

            const brandSelect = document.getElementById('device-brand-select');
            if (brandSelect) brandSelect.value = brandVal;
            document.getElementById('device-brand').value = brandVal;

            updateModalNameOptions(d.name || '');
            updateModalTypeOptions(brandVal, d.type || 'ZIN');

            let dPart = (d.part || '').toUpperCase();
            if (dPart === 'BO SẠC') dPart = 'CÁP SẠC';
            if (dPart === 'MÀN') dPart = 'MÀN HÌNH';
            const partSelect = document.getElementById('device-part-select');
            if (partSelect) partSelect.value = dPart;
            document.getElementById('device-part').value = dPart;

            document.getElementById('device-price').value = formatMoney(d.price);
            document.getElementById('device-cost').value = formatMoney(d.cost);
            document.getElementById('device-qty').value = d.qty !== undefined ? d.qty : 1;
            document.getElementById('device-color').value = d.color || '';
            updateModalStats();
        }

        function duplicateDevice(index) {
            const d = devices[index];
            document.getElementById('device-index').value = '-1';
            const brandVal = d.brand || 'IPHONE';
            populateModalSelects(brandVal);
            document.getElementById('device-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = 'THÊM BẢN SAO LINH KIỆN';

            const brandSelect = document.getElementById('device-brand-select');
            if (brandSelect) brandSelect.value = brandVal;
            document.getElementById('device-brand').value = brandVal;

            const copyName = (d.name || '') + ' (COPY)';
            updateModalNameOptions(copyName);
            updateModalTypeOptions(brandVal, d.type || 'ZIN');

            let dPart = (d.part || '').toUpperCase();
            if (dPart === 'BO SẠC') dPart = 'CÁP SẠC';
            if (dPart === 'MÀN') dPart = 'MÀN HÌNH';
            const partSelect = document.getElementById('device-part-select');
            if (partSelect) partSelect.value = dPart;
            document.getElementById('device-part').value = dPart;

            document.getElementById('device-price').value = formatMoney(d.price);
            document.getElementById('device-cost').value = formatMoney(d.cost);
            document.getElementById('device-qty').value = d.qty !== undefined ? d.qty : 1;
            document.getElementById('device-color').value = d.color || '';
            updateModalStats();
        }

        function addToCartRepair(index) {
            const d = devices[index];
            if (!d) return;
            alert('ĐÃ CHỌN LINH KIỆN: ' + (d.name || '') + ' - ' + (d.part || '') + ' (GIÁ BÁN: ' + formatMoney(d.price) + ')');
        }

        function deleteDevice(index) {
            if (confirm('BẠN CÓ CHẮC MUỐN XÓA MỤC NÀY KHÔNG?')) {
                devices.splice(index, 1);
                saveAllToCloud();
                renderTable();
            }
        }

        function handleEntity(entityType, action) {
            let listRef, inputId, selectId, labelName;
            const currentSelectedBrand = (document.getElementById('device-brand')?.value || document.getElementById('device-brand-select')?.value || currentBrand || 'IPHONE').trim().toUpperCase();

            if (entityType === 'brands') {
                listRef = brands; inputId = 'device-brand'; selectId = 'device-brand-select'; labelName = 'HÃNG';
            } else if (entityType === 'categories') {
                listRef = categories; inputId = 'device-part'; selectId = 'device-part-select'; labelName = 'LINH KIỆN';
            } else if (entityType === 'types') {
                listRef = getTypesForBrand(currentSelectedBrand); inputId = 'device-type'; selectId = 'device-type-select'; labelName = `KIỂU (${currentSelectedBrand})`;
            } else if (entityType === 'names') {
                listRef = names; inputId = 'device-name'; selectId = null; labelName = 'TÊN MÁY';
            }

            const inputEl = document.getElementById(inputId);
            const selectEl = selectId ? document.getElementById(selectId) : null;
            let val = (inputEl?.value || selectEl?.value || '').trim().toUpperCase();

            if (action === 'add') {
                const newVal = prompt(`NHẬP TÊN ${labelName} MỚI:`);
                if (newVal) {
                    const cleanVal = newVal.trim().toUpperCase();
                    if (!cleanVal) return;
                    if (!listRef.includes(cleanVal)) {
                        listRef.push(cleanVal);
                        if (entityType === 'types' && !types.includes(cleanVal)) {
                            types.push(cleanVal);
                        }
                        saveAllToCloud();
                    }
                    populateModalSelects(currentSelectedBrand);
                    if (selectEl) selectEl.value = cleanVal;
                    if (inputEl) inputEl.value = cleanVal;
                    if (entityType === 'brands' || entityType === 'names') updateModalNameOptions(entityType === 'names' ? cleanVal : '');
                    initTabs();
                    renderTable();
                }
            } else if (action === 'edit') {
                if (!val) { alert(`VUI LÒNG CHỌN HOẶC NHẬP ${labelName} CẦN SỬA!`); return; }
                const oldVal = prompt(`NHẬP TÊN MỚI THAY THẾ CHO "${val}":`, val);
                if (oldVal) {
                    let newVal = oldVal.trim().toUpperCase();
                    const idx = listRef.indexOf(val);
                    if (idx !== -1) listRef[idx] = newVal;
                    else listRef.push(newVal);

                    if (entityType === 'types' && !types.includes(newVal)) {
                        types.push(newVal);
                    }

                    devices.forEach(d => {
                        if (entityType === 'brands' && d.brand === val) d.brand = newVal;
                        if (entityType === 'categories' && d.part === val) d.part = newVal;
                        if (entityType === 'types' && (d.brand || '').trim().toUpperCase() === currentSelectedBrand && d.type === val) d.type = newVal;
                        if (entityType === 'names' && d.name === val) d.name = newVal;
                    });

                    saveAllToCloud();
                    populateModalSelects(currentSelectedBrand);
                    if (selectEl) selectEl.value = newVal;
                    if (inputEl) inputEl.value = newVal;
                    if (entityType === 'brands' || entityType === 'names') updateModalNameOptions(entityType === 'names' ? newVal : '');
                    initTabs();
                    renderTable();
                }
            } else if (action === 'delete') {
                if (!val) { alert(`VUI LÒNG CHỌN HOẶC NHẬP ${labelName} CẦN XÓA!`); return; }
                if (confirm(`BẠN CÓ CHẮC MUỐN XÓA "${val}" KHỎI DANH SÁCH ${labelName}?`)) {
                    // 1. Xóa tất cả các phần tử trùng khỏi danh sách cấu hình (không phân biệt hoa thường)
                    for (let i = listRef.length - 1; i >= 0; i--) {
                        if (listRef[i].trim().toUpperCase() === val) {
                            listRef.splice(i, 1);
                        }
                    }

                    // 2. Xóa khỏi danh sách tên máy / thuộc tính trong devices
                    devices.forEach(d => {
                        if (entityType === 'brands' && (d.brand || '').trim().toUpperCase() === val) d.brand = '';
                        if (entityType === 'categories' && (d.part || '').trim().toUpperCase() === val) d.part = '';
                        if (entityType === 'types' && (d.brand || '').trim().toUpperCase() === currentSelectedBrand && (d.type || '').trim().toUpperCase() === val) d.type = '';
                        if (entityType === 'names' && (d.name || '').trim().toUpperCase() === val) d.name = '';
                    });

                    // 3. Nếu là currentType hoặc currentCategory hoặc currentBrand thì reset về mặc định
                    if (entityType === 'types' && currentType.toUpperCase() === val) currentType = '';
                    if (entityType === 'categories' && currentCategory.toUpperCase() === val) currentCategory = categories[0] || '';
                    if (entityType === 'brands' && currentBrand.toUpperCase() === val) currentBrand = 'TẤT CẢ';

                    saveAllToCloud();
                    populateModalSelects(currentSelectedBrand);

                    // Cập nhật lại giá trị trên input/select của modal
                    if (selectEl) {
                        selectEl.value = selectEl.options.length > 0 ? selectEl.options[0].value : '';
                        if (inputEl) inputEl.value = selectEl.value;
                    } else if (inputEl) {
                        inputEl.value = '';
                    }

                    if (entityType === 'brands' || entityType === 'names') updateModalNameOptions();
                    initTabs();
                    renderTable();
                    alert(`✓ ĐÃ XÓA "${val}" KHỎI DANH SÁCH THÀNH CÔNG!`);
                }
            }
        }

        // ==================== QUẢN LÝ EXCEL (NHẬP, XUẤT .XLSX, XÓA DỮ LIỆU) ====================
        function toggleExcelMenu(e) {
            if (e) e.stopPropagation();
            const dd = document.getElementById('excel-dropdown-menu');
            if (dd) {
                dd.classList.toggle('hidden');
            }
        }

        document.addEventListener('click', function (e) {
            const dd = document.getElementById('excel-dropdown-menu');
            if (dd && !e.target.closest('.bg-excel-menu-wrap')) {
                dd.classList.add('hidden');
            }
        });

        function triggerImportExcel() {
            const dd = document.getElementById('excel-dropdown-menu');
            if (dd) dd.classList.add('hidden');
            const fileInput = document.getElementById('excel-file-input');
            if (fileInput) {
                fileInput.value = '';
                fileInput.click();
            }
        }

        function handleExcelFileImport(e) {
            const file = e.target.files ? e.target.files[0] : null;
            if (!file) return;

            if (typeof XLSX === 'undefined') {
                alert('Thư viện Excel đang tải, vui lòng thử lại sau vài giây!');
                return;
            }

            const reader = new FileReader();
            reader.onload = async function (evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    if (!firstSheetName) {
                        alert('File Excel không có trang tính hợp lệ!');
                        return;
                    }

                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                    if (!rows || rows.length === 0) {
                        alert('File Excel trống hoặc không có dòng dữ liệu nào!');
                        return;
                    }

                    let addedCount = 0;
                    rows.forEach(r => {
                        // 1. Tên máy
                        const name = (r['TÊN MÁY'] || r['Tên máy'] || r['TEN MAY'] || r['THUỘC LOẠI MÁY'] || r['Thuộc loại máy'] || r['THUOC LOAI MAY'] || r['name'] || r['NAME'] || r['Model'] || r['MODEL'] || r['device'] || r['Device'] || '').toString().trim().toUpperCase();
                        if (!name) return;

                        // 2. Hãng
                        let brand = (r['HÃNG'] || r['Hãng'] || r['brand'] || r['BRAND'] || '').toString().trim().toUpperCase();
                        if (!brand) {
                            if (/^(IPHONE|IP|X|XR|XS|11|12|13|14|15|16|6|7|8|5)/i.test(name)) brand = 'IPHONE';
                            else if (/^(SAMSUNG|GALAXY|NOTE|A\d|S\d)/i.test(name)) brand = 'SAMSUNG';
                            else if (/^(OPPO|REALME)/i.test(name)) brand = 'OPPO - REALME';
                            else if (/^(REDMI|POCO|XIAOMI)/i.test(name)) brand = 'REDMI - POCO';
                            else if (/^(VIVO)/i.test(name)) brand = 'VIVO';
                            else brand = currentBrand && currentBrand !== 'TẤT CẢ' && currentBrand !== 'HẾT HÀNG' && currentBrand !== 'NHẬP HÀNG' ? currentBrand : 'IPHONE';
                        }

                        // 3. Linh kiện & Kiểu
                        let part = (r['LINH KIỆN'] || r['Linh kiện'] || r['LINH KIEN'] || r['part'] || r['PART'] || '').toString().trim().toUpperCase();
                        let type = (r['KIỂU'] || r['Kiểu'] || r['KIEU'] || r['type'] || r['TYPE'] || '').toString().trim().toUpperCase();

                        // Nếu file dùng cột 'Loại linh kiện' gộp chung cả loại linh kiện và kiểu (như: 'Pin DL Cao (Jufuxing)', 'Màn GX', 'Pin Rẻ')
                        const rawLoaiLK = (r['LOẠI LINH KIỆN'] || r['Loại linh kiện'] || r['LOAI LINH KIEN'] || '').toString().trim();
                        if (rawLoaiLK) {
                            const upperLK = rawLoaiLK.toUpperCase();
                            if (upperLK.includes('PIN')) {
                                part = 'PIN';
                                if (!type) type = rawLoaiLK.replace(/PIN/i, '').trim().toUpperCase();
                            } else if (upperLK.includes('MÀN') || upperLK.includes('MAN')) {
                                part = 'MÀN HÌNH';
                                if (!type) type = rawLoaiLK.replace(/MÀN HÌNH|MAN HINH|MÀN|MAN/i, '').trim().toUpperCase();
                            } else if (upperLK.includes('CÁP SẠC') || upperLK.includes('BO SẠC') || upperLK.includes('CHÂN SẠC') || upperLK.includes('CAP SAC') || upperLK.includes('BO SAC')) {
                                part = 'CÁP SẠC';
                                if (!type) type = rawLoaiLK.replace(/CÁP SẠC|BO SẠC|CHÂN SẠC|CAP SAC|BO SAC/i, '').trim().toUpperCase();
                            } else if (upperLK.includes('KÍNH') || upperLK.includes('KINH')) {
                                part = 'KÍNH ÉP';
                                if (!type) type = rawLoaiLK.replace(/KÍNH ÉP|KINH EP|KÍNH|KINH/i, '').trim().toUpperCase();
                            } else if (upperLK.includes('LƯNG') || upperLK.includes('LUNG')) {
                                part = 'LƯNG';
                                if (!type) type = rawLoaiLK.replace(/LƯNG|LUNG/i, '').trim().toUpperCase();
                            } else if (upperLK.includes('CÁP NỐI') || upperLK.includes('CAP NOI')) {
                                part = 'CÁP NỐI';
                                if (!type) type = rawLoaiLK.replace(/CÁP NỐI|CAP NOI/i, '').trim().toUpperCase();
                            } else if (!part) {
                                part = rawLoaiLK.toUpperCase();
                            }
                        }

                        if (!part) part = 'MÀN HÌNH';
                        if (part === 'BO SẠC') part = 'CÁP SẠC';
                        if (part === 'MÀN') part = 'MÀN HÌNH';

                        type = type.replace(/^[-_\s:()]+|[-_\s:()]+$/g, '').trim().toUpperCase();
                        if (!type) type = 'ZIN';

                        // 4. Giá bán & Giá nhập
                        let priceRaw = (r['GIÁ BÁN (VNĐ)'] || r['GIÁ BÁN'] || r['Giá bán'] || r['GIA BAN'] || r['GIÁ THAY KHÁCH'] || r['Giá thay khách'] || r['GIA THAY KHACH'] || r['GIÁ THAY'] || r['Giá thay'] || r['price'] || r['PRICE'] || r['priceSell'] || '0').toString().trim();
                        let costRaw = (r['GIÁ NHẬP (VNĐ)'] || r['GIÁ NHẬP'] || r['Giá nhập'] || r['GIA NHAP'] || r['GIÁ VỐN'] || r['Giá vốn'] || r['cost'] || r['COST'] || r['priceCost'] || '0').toString().trim();

                        // Nếu giá ở file là số hàng trăm nghìn được viết tắt (vd 400 = 400.000, 190 = 190.000)
                        let priceNum = parseMoney(priceRaw);
                        if (priceNum > 0 && priceNum < 1000) priceNum = priceNum * 1000;

                        let costNum = parseMoney(costRaw);
                        if (costNum > 0 && costNum < 1000) costNum = costNum * 1000;

                        // 5. Số lượng & Màu sắc
                        const qtyVal = parseInt(r['SỐ LƯỢNG'] || r['Số lượng'] || r['SO LUONG'] || r['SL'] || r['qty'] || r['QTY'] || 1, 10);
                        const qty = isNaN(qtyVal) ? 1 : qtyVal;
                        const color = (r['MÀU SẮC'] || r['Màu sắc'] || r['MAU SAC'] || r['MÀU'] || r['color'] || r['COLOR'] || '').toString().trim().toUpperCase();

                        // Thêm vào danh sách bộ lọc cấu hình nếu chưa có
                        if (!brands.includes(brand)) brands.push(brand);
                        if (!categories.includes(part)) categories.push(part);
                        if (type) {
                            if (!types.includes(type)) types.push(type);
                            if (!brandTypes[brand]) brandTypes[brand] = getTypesForBrand(brand);
                            if (!brandTypes[brand].includes(type)) brandTypes[brand].push(type);
                        }
                        if (!names.includes(name)) names.push(name);

                        devices.push({
                            brand,
                            name,
                            part,
                            type,
                            price: formatMoney(priceNum),
                            cost: formatMoney(costNum),
                            qty,
                            color
                        });
                        addedCount++;
                    });

                    if (addedCount > 0) {
                        await saveAllToCloud();
                        initTabs();
                        renderTable();
                        alert(`✓ NHẬP EXCEL THÀNH CÔNG: Đã thêm ${addedCount} linh kiện vào hệ thống!`);
                    } else {
                        alert('Không tìm thấy dòng dữ liệu linh kiện hợp lệ trong file Excel!');
                    }
                } catch (err) {
                    console.error('Lỗi khi đọc file Excel:', err);
                    alert('LỖI ĐỌC FILE EXCEL: ' + (err.message || 'Vui lòng kiểm tra định dạng file!'));
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportToExcel() {
            const dd = document.getElementById('excel-dropdown-menu');
            if (dd) dd.classList.add('hidden');

            if (typeof XLSX === 'undefined') {
                alert('Thư viện Excel đang tải, vui lòng thử lại sau vài giây!');
                return;
            }

            if (!devices || devices.length === 0) {
                alert('Danh sách báo giá linh kiện hiện đang trống!');
                return;
            }

            try {
                // Chuẩn bị dữ liệu xuất Excel đẹp, chuyên nghiệp
                const exportData = devices.map((d, index) => {
                    const priceNum = parseMoney(d.price);
                    const costNum = parseMoney(d.cost);
                    const profitNum = priceNum - costNum;

                    return {
                        'STT': index + 1,
                        'HÃNG': d.brand || '',
                        'TÊN MÁY': d.name || '',
                        'LINH KIỆN': d.part || '',
                        'KIỂU': d.type || '',
                        'MÀU SẮC': d.color || '',
                        'SỐ LƯỢNG': d.qty !== undefined ? d.qty : 1,
                        'GIÁ BÁN (VNĐ)': formatMoney(d.price),
                        'GIÁ NHẬP (VNĐ)': formatMoney(d.cost),
                        'LÃI (VNĐ)': formatMoney(profitNum)
                    };
                });

                const ws = XLSX.utils.json_to_sheet(exportData);

                // Căn chỉnh độ rộng các cột
                ws['!cols'] = [
                    { wch: 6 },  // STT
                    { wch: 16 }, // HÃNG
                    { wch: 25 }, // TÊN MÁY
                    { wch: 18 }, // LINH KIỆN
                    { wch: 15 }, // KIỂU
                    { wch: 14 }, // MÀU SẮC
                    { wch: 10 }, // SỐ LƯỢNG
                    { wch: 16 }, // GIÁ BÁN
                    { wch: 16 }, // GIÁ NHẬP
                    { wch: 16 }  // LÃI
                ];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Bao_Gia_Linh_Kien");

                // Tạo tên file kèm ngày giờ hiện tại
                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const fileName = `Bao_Gia_Linh_Kien_${dateStr}.xlsx`;

                XLSX.writeFile(wb, fileName);
            } catch (err) {
                console.error('Lỗi khi xuất file Excel:', err);
                alert('Lỗi khi xuất file Excel: ' + err.message);
            }
        }

        async function clearAllDevicesData() {
            const dd = document.getElementById('excel-dropdown-menu');
            if (dd) dd.classList.add('hidden');

            const isConfirmed = confirm('⚠️ CẢNH BÁO QUAN TRỌNG:\n\nBạn có chắc chắn muốn XÓA TOÀN BỘ danh sách báo giá linh kiện không?\n\n(Bấm OK hoặc Yes để xác nhận xóa, bấm Cancel để hủy)');
            if (isConfirmed) {
                devices = [];
                await saveAllToCloud();
                renderTable();
                alert('✓ ĐÃ XÓA TOÀN BỘ DANH SÁCH BÁO GIÁ LINH KIỆN THÀNH CÔNG!');
            }
        }

        window.onload = function () {
            syncFromCloud();
        };
    </script>
